<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrderKuota Payment Gateway Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #1e293b;
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 14px;
            color: #94a3b8;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }

        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.4);
        }

        .btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .payment-box {
            display: none;
            text-align: center;
        }

        .qris-img {
            width: 220px;
            height: 220px;
            background: #fff;
            padding: 12px;
            border-radius: 16px;
            margin: 20px auto;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .qris-img img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .amount-card {
            background: #0f172a;
            border: 1px dashed #38bdf8;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .amount-card .label {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .amount-card .total {
            font-size: 26px;
            font-weight: 800;
            color: #38bdf8;
        }

        .warning-tag {
            font-size: 12px;
            color: #fbbf24;
            background: rgba(251, 191, 36, 0.1);
            padding: 8px 12px;
            border-radius: 8px;
            margin-top: 8px;
            display: inline-block;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .status-pending {
            background: rgba(234, 179, 8, 0.2);
            color: #facc15;
        }

        .status-paid {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }

        .loader {
            width: 14px;
            height: 14px;
            border: 2px solid currentColor;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Payment Gateway Demo</h1>
        <p>OrderKuota QRIS Payment Engine</p>
    </div>

    <!-- FORM PEMBUATAN INVOICE -->
    <div id="formSection">
        <div class="form-group">
            <label>Nama Pelanggan</label>
            <input type="text" id="custName" value="Andika Anwar" placeholder="Nama Lengkap">
        </div>
        <div class="form-group">
            <label>Nominal Pembayaran (Rp)</label>
            <input type="number" id="amount" value="10000" placeholder="Contoh: 10000">
        </div>
        <button class="btn" onclick="createPayment()">Buat Tagihan QRIS</button>
    </div>

    <!-- STRUK PEMBAYARAN & QRIS -->
    <div id="paymentSection" class="payment-box">
        <div id="statusBadge" class="status-badge status-pending">
            <span class="loader"></span> Menunggu Pembayaran...
        </div>

        <div class="qris-img">
            <img id="qrisImage" src="" alt="QRIS Code">
        </div>

        <div class="amount-card">
            <div class="label">TOTAL BAYAR (DINAMIS & OTOMATIS)</div>
            <div class="total" id="totalAmount">Rp 0</div>
            <div class="warning-tag" style="background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3);">
                ⚡ QRIS DINAMIS: Nominal otomatis terisi & terkunci saat di-scan!
            </div>
        </div>

        <p style="font-size: 13px; color: #94a3b8; margin-bottom: 12px;">Invoice ID: <span id="invoiceId" style="color: #fff;">-</span></p>
        <p style="font-size: 12px; color: #64748b;">Sistem mengecek mutasi masuk secara otomatis setiap 15 detik.</p>
    </div>
</div>

<script>
    let checkInterval = null;

    async function createPayment() {
        const name = document.getElementById('custName').value;
        const amount = document.getElementById('amount').value;

        if (!amount || amount < 1000) {
            alert('Nominal minimal Rp 1.000');
            return;
        }

        try {
            const response = await fetch('/api/payment/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    amount: parseInt(amount),
                    customer_name: name,
                    order_id: 'ORDER-' + Date.now()
                })
            });

            const res = await response.json();

            if (res.success) {
                document.getElementById('formSection').style.display = 'none';
                document.getElementById('paymentSection').style.display = 'block';

                document.getElementById('qrisImage').src = res.data.qris_url;
                document.getElementById('totalAmount').innerText = 'Rp ' + res.data.total_bayar.toLocaleString('id-ID');
                document.getElementById('invoiceId').innerText = res.data.invoice_id;

                // Mulai polling status otomatis setiap 5 detik
                startCheckingStatus(res.data.invoice_id);
            } else {
                alert('Gagal: ' + res.message);
            }
        } catch (e) {
            alert('Terjadi kesalahan koneksi ke server.');
        }
    }

    function startCheckingStatus(invoiceId) {
        checkInterval = setInterval(async () => {
            try {
                const res = await fetch('/api/payment/status/' + invoiceId);
                const data = await res.json();

                if (data.success && data.data.status === 'PAID') {
                    clearInterval(checkInterval);
                    const badge = document.getElementById('statusBadge');
                    badge.className = 'status-badge status-paid';
                    badge.innerHTML = '🎉 PEMBAYARAN LUNAS!';
                    alert('Selamat! Pembayaran Rp ' + data.data.total_amount.toLocaleString('id-ID') + ' telah diterima.');
                }
            } catch (e) {}
        }, 5000);
    }
</script>

</body>
</html>
